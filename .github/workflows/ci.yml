name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: nuget.config

      # 仓库不含第三方引擎二进制：从最新 Release 的 .msi 资产中取出 avifenc.exe 放到 tools\（动态取，不写死版本）
      - name: Fetch encoding engine (avifenc.exe)
        shell: pwsh
        run: |
          if (-not (Test-Path tools/avifenc.exe)) {
            $msi = Join-Path $env:RUNNER_TEMP 'engine.msi'
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/SapphireRapids/avif-tool/releases/latest'
            $asset = $rel.assets | Where-Object { $_.name -like '*.msi' } | Select-Object -First 1
            if (-not $asset) { throw 'no .msi asset in the latest release' }
            Write-Host \"engine source: $($asset.name)\"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $msi
            $dir = Join-Path $env:RUNNER_TEMP 'engine-extract'
            Start-Process -Wait msiexec -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$dir`""
            $exe = Get-ChildItem $dir -Recurse -Filter avifenc.exe | Select-Object -First 1
            if (-not $exe) { throw 'avifenc.exe not found inside the release MSI' }
            New-Item -ItemType Directory -Force -Path tools | Out-Null
            Copy-Item $exe.FullName tools/avifenc.exe
          }
          & tools/avifenc.exe --version

      # -nodeReuse:false -m:1：规避 MSBuild 节点复用（命名管道）在受限环境下的静默失败
      - name: Build solution
        run: dotnet build avif-tool.sln -c Release -nodeReuse:false -m:1

      - name: EngineTest (end-to-end through app pipeline)
        run: dotnet run --project test/EngineTest -c Release

      - name: Stress regression (quick)
        shell: pwsh
        run: |
          python -m pip install --quiet numpy pillow
          python test/StressHarness/gen-corpus.py --out $env:RUNNER_TEMP/corpus --scale quick
          dotnet run --project test/StressHarness -c Release -- `
            --corpus $env:RUNNER_TEMP/corpus --out $env:RUNNER_TEMP/stress-out --engine (Resolve-Path tools/avifenc.exe) --quick

      - name: Publish + headless smoke
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'ci-diag.txt'
          function Log($m) { $m | Out-File $log -Append }
          try {
            Log "=== dotnet publish ==="
            $pub = dotnet publish src/AvifForge -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish 2>&1
            Log (($pub | Select-Object -Last 8 | Out-String).Trim())
            Log "publish exit=$LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) { throw "publish exit $LASTEXITCODE" }
            Log "=== smoke ==="
            $env:AVIFFORGE_SMOKE_FILE = Join-Path $env:RUNNER_TEMP 'smoke.txt'
            $smk = & publish/AvifForge.exe --smoke 2>&1
            Log (($smk | Out-String).Trim())
            Log "smoke exit=$LASTEXITCODE"
            if (Test-Path $env:AVIFFORGE_SMOKE_FILE) { Log ("smoke file: " + (Get-Content $env:AVIFFORGE_SMOKE_FILE -Raw).Trim()) } else { Log 'smoke file MISSING' }
            if (Test-Path publish/AvifForge.exe) { Log ("published exe bytes: " + (Get-Item publish/AvifForge.exe).Length) }
            Log ("OS: " + (Get-CimInstance Win32_OperatingSystem).Caption)
            if ($LASTEXITCODE -ne 0) { throw "smoke exit $LASTEXITCODE" }
          } catch {
            Log ("EXCEPTION: " + $_)
            throw
          }

      - name: Upload CI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: ${{ runner.temp }}/ci-diag.txt
          if-no-files-found: warn
